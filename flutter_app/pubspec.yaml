name: watermelon_ripeness
description: Karpuz Olgunluk Tespit Uygulaması - Multi-Modal On-Device AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # Multimodal capture
  camera: ^0.10.5
  image: ^4.1.3
  record: ^5.1.2
  sensors_plus: ^4.0.2
  vibration: ^1.9.0

  # DSP / Signal processing
  fftea: ^1.5.0
  wav: ^1.4.0

  # ML inference
  tflite_flutter: ^0.11.0

  # System
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  share_plus: ^7.2.2
  pdf: ^3.10.7
  provider: ^6.1.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

dependency_overrides:
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/fusion_model_fp16.tflite
    - assets/models/visual_classifier_fp16.tflite
    - assets/test/wm1_chu1.wav
    - assets/test/wm1_chu1_python_features.json
    - assets/samples/
